const iconPaths={spark:'<path d="m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9L12 3Z"/><path d="m19 18 .7 1.3L21 20l-1.3.7L19 22l-.7-1.3L17 20l1.3-.7L19 18Z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',moon:'<path d="M20.8 13.1A9 9 0 0 1 10.9 3.2 9 9 0 1 0 20.8 13.1Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 4 4 14 0 18M12 3c-4 4-4 14 0 18"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="M19 12H5m6 6-6-6 6-6"/>',building:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 3h8v4M8 12h2m4 0h2M8 16h2m4 0h2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',chevron:'<path d="m9 18 6-6-6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',shield:'<path d="m12 22-2.7-1.3C5.8 19 4 16.4 4 12V5l8-3 8 3v7c0 4.4-1.8 7-5.3 8.7L12 22Z"/><path d="m9 12 2 2 4-4"/>',logout:'<path d="M10 17l5-5-5-5m5 5H3M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/>',seat:'<path d="M5 11h14a2 2 0 0 1 2 2v4H3v-4a2 2 0 0 1 2-2Z"/><path d="M6 11V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v5M5 17v3m14-3v3"/>'};
const I=(n,extra='')=>`<svg class="icon ${extra}" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[n]||iconPaths.spark}</svg>`;
const words={ar:{chat:'المساعد الذكي',bookings:'تقويم حجوزاتي',changeRole:'تبديل الدور',employee:'الموظف',admin:'مسؤول القاعات',available:'متاحة',maintenance:'تحت الصيانة',confirm:'تأكيد الحجز',cancel:'إلغاء',empty:'لا توجد حجوزات في هذا اليوم',new:'حجز جديد'},en:{chat:'AI assistant',bookings:'My calendar',changeRole:'Switch role',employee:'Employee',admin:'Room manager',available:'Available',maintenance:'Maintenance',confirm:'Confirm booking',cancel:'Cancel',empty:'No bookings on this day',new:'New booking'}};
const storageKey='meetspace-a-redesign-v1';
const future=(days)=>{let x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()+days);return localDate(x)};
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateObj(iso){let [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d,12)}
function dateFmt(iso,lang='ar',opts={day:'numeric',month:'long',year:'numeric'}){return dateObj(iso).toLocaleDateString(lang==='ar'?'ar-SA-u-ca-gregory':'en-GB',opts)}
const rooms=[{id:'T01',ar:'قاعة التدريب 01',en:'Training Room 01',type:'training',cap:10},{id:'T02',ar:'قاعة التدريب 02',en:'Training Room 02',type:'training',cap:15},{id:'T03',ar:'قاعة التدريب 03',en:'Training Room 03',type:'training',cap:15},{id:'T04',ar:'قاعة التدريب 04',en:'Training Room 04',type:'training',cap:20},{id:'T05',ar:'قاعة التدريب 05',en:'Training Room 05',type:'training',cap:30},{id:'M01',ar:'قاعة الاجتماعات 01',en:'Meeting Room 01',type:'meeting',cap:6},{id:'M02',ar:'قاعة الاجتماعات 02',en:'Meeting Room 02',type:'meeting',cap:6},{id:'M03',ar:'قاعة الاجتماعات 03',en:'Meeting Room 03',type:'meeting',cap:10},{id:'M04',ar:'قاعة الاجتماعات 04',en:'Meeting Room 04',type:'meeting',cap:10},{id:'M05',ar:'قاعة الاجتماعات 05',en:'Meeting Room 05',type:'meeting',cap:15}];
const employees=[{id:'sara',ar:'سارة أحمد',en:'Sarah Ahmed'},{id:'noura',ar:'نورة محمد',en:'Noura Mohammed'},{id:'fahad',ar:'فهد علي',en:'Fahad Ali'}];
let stored={};try{stored=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(_){}
const seededBookings=[{id:'SAMPLE-1',employee:'sara',room:'M03',date:future(2),from:'09:00',to:'10:00',status:'confirmed',sample:true},{id:'SAMPLE-2',employee:'sara',room:'T01',date:future(6),from:'13:00',to:'15:00',status:'confirmed',sample:true},{id:'SAMPLE-3',employee:'noura',room:'T02',date:future(3),from:'10:00',to:'12:00',status:'confirmed',sample:true}];
let s={theme:stored.theme||'light',lang:stored.lang||'ar',role:'employee',view:'chat',employee:stored.employee||'sara',bookings:Array.isArray(stored.bookings)?stored.bookings:seededBookings,maintenance:stored.maintenance||{},calendarMonth:new Date().getMonth(),calendarYear:new Date().getFullYear(),selectedDay:future(2),scenario:'typical',offer:null,slots:[],draft:null,messages:[]};
let bookingDate=future(3);
const tr=(ar,en)=>s.lang==='ar'?ar:en;
const tx=(key)=>words[s.lang][key];
const nameRoom=(id)=>{let r=rooms.find(x=>x.id===id);return r?(s.lang==='ar'?r.ar:r.en):id};
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify({theme:s.theme,lang:s.lang,employee:s.employee,bookings:s.bookings,maintenance:s.maintenance}))}catch(_){}};
const clean=(val)=>String(val).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const header=()=>`<header class="site-header"><div class="header-content"><div class="brand"><span class="brand-mark">${I('spark','large')}</span>MeetSpace<span class="brand-dot">.</span></div>${s.role==='employee'?`<nav class="main-nav" aria-label="Employee navigation"><button class="nav-btn ${s.view==='chat'?'active':''}" data-view="chat">${I('spark','small')}${tx('chat')}</button><button class="nav-btn ${s.view==='calendar'?'active':''}" data-view="calendar">${I('calendar','small')}${tx('bookings')}</button></nav>`:`<nav class="main-nav"><span class="nav-btn active">${s.role==='admin'?I('shield','small')+tx('admin'):I('users','small')+tr('اختيار طريقة الدخول','Choose your experience')}</span></nav>`}<div class="header-actions"><button class="icon-button" data-theme aria-label="${tr('تغيير النمط','Toggle theme')}" title="${tr('النمط الليلي / النهاري','Light / dark')}">${I(s.theme==='light'?'moon':'sun')}</button><button class="icon-button" data-language aria-label="${tr('تغيير اللغة','Switch language')}" title="AR / EN">${I('globe')}</button>${s.role==='employee'?`<div class="avatar-group"><span class="avatar">${s.employee==='sara'?'س':s.employee==='noura'?'ن':'ف'}</span><select id="employee-select" aria-label="Employee">${employees.map(x=>`<option value="${x.id}" ${s.employee===x.id?'selected':''}>${s.lang==='ar'?x.ar:x.en}</option>`).join('')}</select></div>`:''}<button class="role-switch" data-role-select title="${tx('changeRole')}">${I('logout','small')}${tx('changeRole')}</button></div></div></header>`;
const foot=()=>`<footer class="footer"><span>MeetSpace © 2026 · ${tr('نموذج واجهات تجريبي','Interactive design prototype')}</span><span>${tr('محاكاة محلية فقط — غير متصل بـ Qwen أو Firebase','UI simulation only — not connected to Qwen or Firebase')}</span></footer>`;
function initChat(){s.offer=null;s.slots=[];s.draft={date:bookingDate,from:'10:00',to:'12:00',attendees:15,type:'training'};s.messages=[{who:'bot',text:tr('أهلًا! أنا مساعد MeetSpace. ✨\nاكتبي تفاصيل القاعة اللي تحتاجينها وبساعدك في اختيار الأنسب.','Hello! I’m MeetSpace. ✨\nTell me what room you need and I’ll help you find it.')}];}
initChat();
function add(who,text){s.messages.push({who,text});}
function typical(){s.scenario='typical';bookingDate=future(3);s.draft={date:bookingDate,from:'10:00',to:'12:00',attendees:15,type:'training'};s.offer=null;s.slots=[];s.messages=[{who:'user',text:tr(`أحتاج قاعة تدريب لـ15 شخص يوم ${dateFmt(bookingDate)} من 10 إلى 12.`,`I need a training room for 15 people on ${dateFmt(bookingDate,'en')} from 10 to 12.`)}];findRooms();}
function messy(){s.scenario='messy';bookingDate=future(4);s.draft={date:bookingDate,from:'10:00',to:null,attendees:null,type:'training'};s.offer=null;s.slots=[];s.messages=[{who:'user',text:tr(`أحتاج قاعة تدريب يوم ${dateFmt(bookingDate)} الساعة 10 صباحًا.`,`I need a training room on ${dateFmt(bookingDate,'en')} at 10am.`)},{who:'bot',text:tr('أكيد! كم عدد الحضور؟ ومتى ينتهي الاجتماع؟','Of course! How many attendees, and what time should the booking end?')}];render();}
function edge(){s.scenario='edge';bookingDate=future(3);s.draft={date:bookingDate,from:'10:00',to:'12:00',attendees:15,type:'training'};s.offer=null;s.slots=[];s.messages=[{who:'user',text:tr(`أبي قاعة التدريب 02 يوم ${dateFmt(bookingDate)} من 10 إلى 12، لـ15 شخص.`,`I want Training Room 02 on ${dateFmt(bookingDate,'en')}, 10 to 12, for 15 people.`)},{who:'bot',text:tr('قاعة التدريب 02 محجوزة في الوقت المطلوب. عندي لك خيارات بديلة متاحة بنفس الفترة.','Training Room 02 is booked for that time. Here are available alternatives for the same slot.')}];s.slots=['T03','T04'].filter(id=>isAvailable(id,s.draft));render();}
function overlap(a,b){return a.from < b.to && a.to > b.from}
function isAvailable(room,draft){return !s.maintenance[room] && rooms.some(r=>r.id===room&&r.cap>=draft.attendees)&&!s.bookings.some(b=>b.room===room&&b.date===draft.date&&b.status==='confirmed'&&overlap(b,draft))}
function findRooms(){let available=rooms.filter(r=>r.type===s.draft.type&&r.cap>=s.draft.attendees&&isAvailable(r.id,s.draft));s.slots=available.slice(0,2).map(r=>r.id);add('bot',s.slots.length?tr('لقيت لك قاعات مناسبة ومتاحة. اختاري اللي تناسبك:','Here are rooms that match your request. Choose one:'):tr('ما لقيت قاعة متاحة بنفس الشروط. جربي وقتًا مختلفًا.','No rooms match those conditions. Please try another time.'));render();}
function roomCards(){if(!s.slots.length)return '';return `<div class="choice-list">${s.slots.map(id=>{const r=rooms.find(x=>x.id===id);return `<div class="room-option"><div class="option-top"><span class="room-mini-icon">${I('building')}</span><span class="status">${tx('available')}</span></div><div class="option-title">${nameRoom(id)}</div><div class="option-desc">${I('seat','small')} ${r.cap} ${tr('مقعد','seats')} · ${tr('يوم','on')} ${dateFmt(s.draft.date,s.lang,{day:'numeric',month:'short'})}</div><button class="small-button" data-choose="${id}">${tr('اختيار القاعة','Select room')} ${I('arrow','small')}</button></div>`}).join('')}</div>`}
function confirmBox(){if(!s.offer)return '';const r=rooms.find(x=>x.id===s.offer.room);return `<div class="confirm-box"><div class="confirm-title">${I('check','small')}${tr('مراجعة تفاصيل الحجز','Review booking details')}</div><div class="confirm-meta"><b>${nameRoom(r.id)}</b><br>${dateFmt(s.offer.date)} · ${s.offer.from}–${s.offer.to} · ${s.offer.attendees} ${tr('شخص','attendees')}</div><div class="confirm-actions"><button class="btn" data-confirm>${I('check','small')}${tx('confirm')}</button><button class="btn outline" data-clear>${tr('رجوع','Back')}</button></div><div class="tiny-note" style="margin-top:7px">${tr('ممكن تكتبين أيضًا «أؤكد الحجز» في المحادثة.','You can also type “Confirm booking” in chat.')}</div></div>`}
function chatMessages(){return s.messages.map(m=>`<div class="message ${m.who==='user'?'user':''}"><span class="mini-avatar">${m.who==='user'?I('users','small'):I('spark','small')}</span><div class="message-content"><div class="bubble">${clean(m.text)}</div><small>${tr('الآن','just now')}</small></div></div>`).join('')}
function chatPanel(){return `<section class="card-shell chat-card"><div class="chat-head"><div class="assistant-title"><span class="ai-avatar">${I('spark','large')}</span><div><strong>MeetSpace AI</strong><small>${tr('مساعد حجز القاعات','Your room booking assistant')}</small></div></div><span class="online">${tr('جاهز للمساعدة','Ready to help')}</span></div><div class="chat-stream" id="chat-stream"><div class="chat-date">${tr('المحادثة التجريبية','Demo conversation')}</div>${chatMessages()}${roomCards()}${confirmBox()}</div><div class="chat-footer"><div class="quick-actions"><button class="quick-btn" data-scenario="typical">${tr('طلب مكتمل','Complete request')}</button><button class="quick-btn" data-scenario="messy">${tr('معلومات ناقصة','Missing details')}</button><button class="quick-btn" data-scenario="edge">${tr('تعارض حجز','Booking conflict')}</button></div><form class="compose" id="chat-form"><input autocomplete="off" id="chat-input" placeholder="${tr('اكتبي طلبك أو ردك هنا...','Write your request or reply...')}" aria-label="Message"/><button type="submit" aria-label="Send">${I('send')}</button></form><div class="compose-foot">${tr('نموذج تفاعلي للتصميم — الردود محاكاة ولا تستخدم نموذج AI حقيقي','Design prototype — simulated responses, no live AI model')}</div></div></section>`}
function employeeChat(){return `<main class="container"><div class="hero-grid"><div class="hero-info"><div class="overline">${tr('الحجز صار أسهل','A smarter way to book')}</div><h1 class="page-title">${tr('المساحة المناسبة،','The right space,')}<br><em>${tr('بمحادثة بسيطة.','one simple chat.')}</em></h1><p class="lead">${tr('قولي لمساعد MeetSpace احتياجك، وراح يساعدك تلقين القاعة المناسبة، تتأكدين من توفرها، وتحجزينها بكل بساطة.','Tell MeetSpace what you need. Find a suitable room, check availability and book through a simple conversation.')}</p><div class="pills"><span class="pill">${I('spark','small')}${tr('مساعد ذكي','AI-powered')}</span><span class="pill">${I('calendar','small')}${tr('حجوزات واضحة','Clear bookings')}</span><span class="pill">${I('check','small')}${tr('تأكيد قبل الحجز','Confirm first')}</span></div><div class="tip-card"><div class="tip-title">${tr('كيف تحجزين قاعتك؟','How does it work?')}</div><div class="tip-row"><span class="tip-num">01</span><span>${tr('اكتبي نوع القاعة، عدد الحضور والموعد.','Describe the room, attendees and date.')}</span></div><div class="tip-row"><span class="tip-num">02</span><span>${tr('اختاري القاعة المناسبة من الخيارات المتاحة.','Select from matching available rooms.')}</span></div><div class="tip-row"><span class="tip-num">03</span><span>${tr('أكدي الحجز وتابعيه من التقويم.','Confirm and track it on your calendar.')}</span></div></div></div>${chatPanel()}</div></main>`}
function calendarGrid(admin=false){const first=new Date(s.calendarYear,s.calendarMonth,1), days=new Date(s.calendarYear,s.calendarMonth+1,0).getDate();const offset=first.getDay();const numRows=Math.ceil((offset+days)/7);let html='';for(let idx=0;idx<numRows*7;idx++){let day=idx-offset+1;let date=new Date(s.calendarYear,s.calendarMonth,day,12);let iso=localDate(date), out=day<1||day>days;let bs=s.bookings.filter(b=>(admin || b.employee===s.employee)&&b.date===iso);html+=`<button class="day ${out?'other':''} ${iso===future(0)?'today':''} ${s.selectedDay===iso?'selected':''}" data-day="${iso}" aria-label="${dateFmt(iso)}"><span class="day-num">${date.getDate()}</span>${bs.slice(0,2).map(b=>`<span class="day-event ${b.status==='canceled'?'cancelled':''}">${nameRoom(b.room)}</span>`).join('')}${bs.length>2?`<span class="tiny-note">+${bs.length-2}</span>`:''}</button>`}return html}
function selectedBookings(admin=false){let bks=s.bookings.filter(b=>(admin || b.employee===s.employee)&&b.date===s.selectedDay).sort((a,b)=>a.from.localeCompare(b.from));return bks.length?bks.map(b=>`<div class="booking-item"><span class="status ${b.status==='canceled'?'maintenance':''}">${b.status==='confirmed'?tr('مؤكد','Confirmed'):tr('ملغى','Canceled')}</span><div style="margin-top:10px"><b>${nameRoom(b.room)}</b></div><div class="booking-meta">${admin?`${I('users','small')} ${clean((employees.find(x=>x.id===b.employee)||{})[s.lang]||b.employee)}<br>`:''}${I('clock','small')} ${b.from} – ${b.to}<br>${I('calendar','small')} ${dateFmt(b.date)}</div><div class="booking-actions"><span class="tiny-note">${b.sample?tr('حجز توضيحي','Sample booking'):tr('حجز تجريبي','Demo booking')}</span>${!admin&&b.status==='confirmed'?`<button class="text-danger" data-cancel="${b.id}">${tr('إلغاء الحجز','Cancel booking')}</button>`:''}</div></div>`).join(''):`<div class="empty">${I('calendar','large')}${tx('empty')}</div>`}
function employeeCalendar(){const monthLabel=new Date(s.calendarYear,s.calendarMonth,1).toLocaleDateString(s.lang==='ar'?'ar-SA-u-ca-gregory':'en-GB',{month:'long',year:'numeric'});return `<main class="container"><div class="page-top"><div><div class="overline">${tr('مساحة الموظف','EMPLOYEE AREA')}</div><h1>${tr('حجوزاتك، بلمحة واحدة.','Your bookings, at a glance.')}</h1><p>${tr('كل مواعيدك في تقويم واضح، وتفاصيل الحجز تظهر عند اختيار اليوم.','See your bookings in one calendar and select a date for details.')}</p></div><button class="btn" data-view="chat">${I('plus','small')}${tx('new')}</button></div><div class="calendar-layout"><section class="calendar-panel"><div class="cal-header"><h2>${monthLabel}</h2><div class="cal-month-actions"><button class="btn ghost" data-today>${tr('اليوم','Today')}</button><button class="cal-arrow" data-prev aria-label="Previous">${I('chevron','small')}</button><button class="cal-arrow" data-next aria-label="Next">${I('back','small')}</button></div></div><div class="calendar-grid">${(s.lang==='ar'?['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']).map(d=>`<div class="weekday">${d}</div>`).join('')}${calendarGrid()}</div><div class="legend"><span><i></i>${tr('حجز مؤكد','Confirmed')}</span><span><i class="cancelled"></i>${tr('حجز ملغى','Cancelled')}</span></div></section><aside class="day-panel"><div class="overline">${tr('تفاصيل اليوم','DAY DETAILS')}</div><div class="side-heading">${tr('حجوزات اليوم المحدد','Selected day bookings')}</div><div class="side-date">${dateFmt(s.selectedDay)}</div>${selectedBookings()}<div class="side-caption">${tr('الحجوزات محفوظة محليًا في المتصفح لهذا النموذج التصميمي فقط.','Bookings are stored locally in the browser for this design demo.')}</div></aside></div></main>`}
function roleSelect(){return `<main class="container"><div class="role-wrapper"><div class="overline" style="justify-content:center">${tr('مرحبًا في MeetSpace','WELCOME TO MEETSPACE')}</div><h1>${tr('كيف تبغين تستخدمين MeetSpace؟','How would you like to enter?')}</h1><p>${tr('واجهتان مستقلتان تمامًا. اختاري تجربة الموظف أو مسؤول القاعات.','Two separate experiences. Choose employee or room manager.')}</p><div class="role-cards"><button class="role-card" data-enter="employee"><div class="role-symbol">${I('spark','large')}</div><h2>${tr('مساحة الموظف','Employee experience')}</h2><p>${tr('احجزي القاعات مع المساعد الذكي، وشوفي كل حجوزاتك على التقويم.','Book rooms with the AI assistant and manage reservations on your calendar.')}</p><span class="link">${tr('الدخول كموظف','Enter as employee')}${I('arrow')}</span></button><button class="role-card admin-role" data-enter="admin"><div class="role-symbol">${I('shield','large')}</div><h2>${tr('مساحة مسؤول القاعات','Room manager experience')}</h2><p>${tr('شاهدي جميع الحجوزات، وتابعي حالة القاعات وضعي القاعة تحت الصيانة عند الحاجة.','See all bookings and manage room maintenance statuses.')}</p><span class="link">${tr('الدخول كمسؤول','Enter as manager')}${I('arrow')}</span></button></div><p class="tiny-note" style="margin-top:26px">${tr('اختيار الدور للتجربة فقط — لا توجد مصادقة حقيقية.','Demo-only role selection — not a secure login.')}</p></div></main>`}
function adminPanel(){let active=s.bookings.filter(x=>x.status==='confirmed');let under=rooms.filter(x=>s.maintenance[x.id]).length;const monthLabel=new Date(s.calendarYear,s.calendarMonth,1).toLocaleDateString(s.lang==='ar'?'ar-SA-u-ca-gregory':'en-GB',{month:'long',year:'numeric'});return `<main class="container"><div class="page-top"><div><div class="overline">${tr('لوحة منفصلة للمسؤول','SEPARATE MANAGER SPACE')}</div><h1>${tr('إدارة القاعات.','Room management.')}</h1><p>${tr('تقويم لجميع الحجوزات، وإدارة بسيطة لحالة القاعات والصيانة.','A calendar of all bookings and simple room maintenance controls.')}</p></div><span class="pill">${I('shield','small')}${tr('عرض تجريبي مستقل','Separate demo area')}</span></div><div class="admin-intro">${I('info','small')}${tr('هذه مساحة منفصلة عن واجهة الموظف، والدخول إليها تجريبي وغير محمي بمصادقة حقيقية.','This is separate from the employee UI, but demo-only and not protected by real authentication.')}</div><div class="admin-stats"><div class="stat"><strong>${rooms.length}</strong><span>${tr('إجمالي القاعات','Total rooms')}</span></div><div class="stat"><strong>${active.length}</strong><span>${tr('الحجوزات المؤكدة','Confirmed bookings')}</span></div><div class="stat"><strong>${under}</strong><span>${tr('قاعات تحت الصيانة','Rooms under maintenance')}</span></div></div><div class="calendar-layout"><section class="calendar-panel"><div class="cal-header"><h2>${tr('تقويم جميع الحجوزات','All bookings calendar')} · ${monthLabel}</h2><div class="cal-month-actions"><button class="btn ghost" data-today>${tr('اليوم','Today')}</button><button class="cal-arrow" data-prev aria-label="Previous">${I('chevron','small')}</button><button class="cal-arrow" data-next aria-label="Next">${I('back','small')}</button></div></div><div class="calendar-grid">${(s.lang==='ar'?['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']).map(d=>`<div class="weekday">${d}</div>`).join('')}${calendarGrid(true)}</div><div class="legend"><span><i></i>${tr('حجز مؤكد','Confirmed')}</span><span><i class="cancelled"></i>${tr('حجز ملغى','Cancelled')}</span></div></section><aside class="day-panel"><div class="overline">${tr('جميع الموظفين','ALL EMPLOYEES')}</div><div class="side-heading">${tr('حجوزات اليوم المحدد','Bookings on selected day')}</div><div class="side-date">${dateFmt(s.selectedDay)}</div>${selectedBookings(true)}</aside></div><section class="rooms-panel admin-rooms-section"><h2 class="section-mini-heading">${tr('حالة القاعات','Room status')}</h2><div class="room-admin-grid">${rooms.map(r=>`<div class="room-admin"><strong>${nameRoom(r.id)}</strong><small>${r.cap} ${tr('مقعد','seats')} · ${r.type==='training'?tr('تدريب','Training'):tr('اجتماعات','Meeting')}</small><button class="${s.maintenance[r.id]?'on-maint':''}" data-maint="${r.id}">${s.maintenance[r.id]?tr('تحت الصيانة · إعادة الإتاحة','Maintenance · Restore'):tr('متاحة · وضع صيانة','Available · Set maintenance')}</button></div>`).join('')}</div><div class="warn-note">${tr('تغيير حالة القاعة يمنع الحجوزات الجديدة في المحاكاة، ولا يلغي الحجوزات الموجودة.','Changing maintenance status prevents new simulated bookings but keeps existing ones.')}</div></section></main>`}
function render(){document.documentElement.dir=s.lang==='ar'?'rtl':'ltr';document.documentElement.lang=s.lang;document.body.classList.toggle('dark',s.theme==='dark');document.getElementById('app').innerHTML=header()+(s.role==='choose'?roleSelect():s.role==='admin'?adminPanel():s.view==='calendar'?employeeCalendar():employeeChat())+foot();let sc=document.getElementById('chat-stream');if(sc)sc.scrollTop=sc.scrollHeight;}
function toast(message){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3000)}
function chooseRoom(room){if(!s.draft||!isAvailable(room,s.draft)){toast(tr('هذه القاعة غير متاحة، جربي خيارًا آخر.','This room is no longer available.'));return} s.offer={...s.draft,room};s.slots=[];add('bot',tr(`اخترتِ ${nameRoom(room)}. راجعي البيانات وأكدي إذا كل شيء مناسب.`,`You selected ${nameRoom(room)}. Review the details and confirm when ready.`));render();}
function confirmBooking(){if(!s.offer){add('bot',tr('ما فيه حجز ينتظر التأكيد. اختاري قاعة أولًا.','There is no pending offer. Select a room first.'));render();return}if(!isAvailable(s.offer.room,s.offer)){add('bot',tr('عذرًا، القاعة لم تعد متاحة. اختاري موعدًا أو قاعة أخرى.','That room is no longer available. Please choose another.'));s.offer=null;render();return}let o=s.offer,id='DEMO-'+Date.now();s.bookings.push({...o,id,employee:s.employee,status:'confirmed',sample:false});s.offer=null;s.slots=[];save();add('bot',tr(`تم تسجيل حجزك التجريبي بنجاح! ✨ ستلقينه في «تقويم حجوزاتي» يوم ${dateFmt(o.date)}.`,`Demo booking confirmed! ✨ Find it in your calendar on ${dateFmt(o.date,'en')}.`));render();toast(tr('حجز تجريبي محفوظ في المتصفح','Demo booking saved in browser'))}
function submitMessage(message){let q=message.trim();if(!q)return;add('user',q);if(/(أؤكد|اكد|أكد|نعم احجز|موافق|confirm|yes,? book|go ahead|book it)/i.test(q)){confirmBooking();return}if(s.scenario==='messy'&&s.draft&&(s.draft.attendees===null||s.draft.to===null)){let n=q.match(/\d+/g);if(n?.length){let nums=n.map(Number);if(s.draft.attendees===null){s.draft.attendees=nums[0]}if(s.draft.to===null){let last=nums[nums.length-1];if(last>=11&&last<=23){s.draft.to=String(last).padStart(2,'0')+':00'}else if(nums.length>1&&last<=12){s.draft.to=String(last+12).padStart(2,'0')+':00'}}}if(!s.draft.attendees||!s.draft.to){add('bot',tr('شكرًا! أحتاج عدد الحضور ووقت النهاية، مثل: 15 شخص، الساعة 12 ظهرًا.','Please provide attendees and end time, e.g. 15 people, ends at 12pm.'));render();return}findRooms();return}
if(s.offer){add('bot',tr('إذا كنتِ موافقة على تفاصيل الحجز، اكتبي «أؤكد الحجز» أو استخدمي زر التأكيد.','If the booking details are correct, type “Confirm booking” or use the confirmation button.'));render();return}add('bot',tr('للتجربة التفاعلية، اختاري من الأمثلة تحت المحادثة: طلب مكتمل، معلومات ناقصة، أو تعارض حجز.','For this interactive prototype, try one of the example scenarios below the chat.'));render();}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('theme' in d){s.theme=s.theme==='light'?'dark':'light';save();render();return}if('language' in d){s.lang=s.lang==='ar'?'en':'ar';initChat();render();save();return}if('roleSelect' in d){s.role='choose';render();return}if('enter' in d){s.role=d.enter;s.view='chat';render();return}if(d.view){s.view=d.view;render();return}if(d.scenario){({typical,messy,edge}[d.scenario]||typical)();return}if(d.choose){chooseRoom(d.choose);return}if('confirm' in d){confirmBooking();return}if('clear' in d){s.offer=null;add('bot',tr('تمام، ما تم تنفيذ الحجز. تقدرين تختارين موعدًا أو قاعة ثانية.','No booking was made. You can try another room or time.'));render();return}if('prev' in d||'next' in d){let n=new Date(s.calendarYear,s.calendarMonth+('next'in d?1:-1),1);s.calendarMonth=n.getMonth();s.calendarYear=n.getFullYear();render();return}if('today' in d){let n=new Date();s.calendarYear=n.getFullYear();s.calendarMonth=n.getMonth();s.selectedDay=future(0);render();return}if(d.day){s.selectedDay=d.day;let n=dateObj(d.day);s.calendarMonth=n.getMonth();s.calendarYear=n.getFullYear();render();return}if(d.cancel){let book=s.bookings.find(x=>x.id===d.cancel&&x.employee===s.employee);if(!book||book.status!=='confirmed')return;if(confirm(tr(`إلغاء حجز ${nameRoom(book.room)} يوم ${dateFmt(book.date)}؟`,`Cancel booking for ${nameRoom(book.room)} on ${dateFmt(book.date,'en')}?`))){book.status='canceled';save();toast(tr('تم إلغاء الحجز التجريبي','Demo booking cancelled'));render()}return}if(d.maint){s.maintenance[d.maint]=!s.maintenance[d.maint];save();toast(tr('تم تحديث حالة القاعة','Room status updated'));render();return}});
document.addEventListener('change',e=>{if(e.target.id==='employee-select'){s.employee=e.target.value;initChat();save();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();let inp=document.getElementById('chat-input');let val=inp.value;inp.value='';submitMessage(val);}});
typical();
})();
</script>
</body>
</html>
